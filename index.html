<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinceles · La app ignaciana</title>
<meta name="theme-color" content="#FBF3E2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">

</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div><div class="brand-title" id="topTitle">Pinceles</div><div class="brand-sub" id="topSub">La app ignaciana</div></div>
    </div>
    <div id="headerActions" style="display:flex; gap:10px; align-items:center;"></div>
  </div>
  <svg class="stroke-divider" viewBox="0 0 400 26" preserveAspectRatio="none"><path class="stroke-path" d="M2 18 C60 4, 120 26, 200 12 S 340 2, 398 16" stroke="var(--rojo)" stroke-width="5" fill="none" stroke-linecap="round"/><path class="stroke-path" d="M2 18 C60 4, 120 26, 200 12 S 340 2, 398 16" stroke="var(--dorado)" stroke-width="2" fill="none" stroke-linecap="round" style="animation-delay:.3s"/></svg>
  <main id="main"></main>
  <div class="bottomnav" id="bottomNav"></div>
  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div id="loader" style="position:fixed; inset:0; z-index:9999; background:rgba(43,24,16,.3); display:none; align-items:center; justify-content:center;">
    <div style="background:var(--blanco); padding:26px 30px; border-radius:24px; box-shadow:var(--sombra); display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div class="brush-loader">
        <span class="brush-text">Pinceles</span>
        <svg class="brush-icon" viewBox="0 0 24 24" fill="none" stroke="var(--rojo)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          <path d="M5.5 15.5L2 22l6.5-3.5"></path>
        </svg>
      </div>
      <span class="loader-label">Cargando</span>
    </div>
  </div>

</div>


<script defer src="./js/config.js"></script>
<script defer src="./js/calculos.js"></script>
<script defer src="./js/state.js"></script>
<script defer src="./js/api.js"></script>
<script defer src="./js/shared.js"></script>
<script defer src="./js/pincel.js"></script>
<script defer src="./js/economia.js"></script>
<script defer src="./js/app.js"></script>
</body>
</html>
