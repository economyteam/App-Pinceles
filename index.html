<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pinceles · La app ignaciana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --rojo: #9E1B15; --rojo-osc: #711209; --dorado: #EBB41E; --dorado-suave: #F6D888; --crema: #FBF3E2; --crema-2: #F3E7CC; --tinta: #2B1810; --oliva: #6B7A3A; --blanco: #FFFDF8; --sombra: 0 8px 24px rgba(43,24,16,.10); --radio: 20px; }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Manrope', sans-serif; background: var(--crema); color: var(--tinta); min-height:100vh; display:flex; justify-content:center; }
  #app{ width:100%; max-width:480px; min-height:100vh; background: var(--crema); position:relative; display:flex; flex-direction:column; box-shadow: 0 0 60px rgba(0,0,0,.08); }
  .topbar{ padding: 18px 20px 14px; display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-title{ font-family:'Caveat',cursive; font-weight:700; font-size:30px; color:var(--rojo); line-height:1; }
  .brand-sub{ font-size:11px; color:var(--tinta); opacity:.6; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .logo-header { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--dorado); box-shadow: var(--sombra); }
  .icon-btn{ width:38px; height:38px; border-radius:50%; background: var(--blanco); border:1px solid rgba(43,24,16,.08); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow: var(--sombra); transition: transform .15s ease; }
  .icon-btn:active{ transform: scale(.92); }
  .btn-logout { background:none; border:none; color:var(--rojo); font-weight:800; font-size:12px; cursor:pointer; font-family:'Manrope'; text-transform:uppercase; padding-right:4px;}
  .stroke-divider{ width:100%; height:26px; display:block; margin-top:-6px; }
  .stroke-path{ stroke-dasharray: 900; stroke-dashoffset:900; animation: draw 1.1s ease forwards .15s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  main{ flex:1; padding: 4px 20px 100px; position:relative; z-index:1; }
  .hidden{ display:none !important; }
  .card{ background: var(--blanco); border-radius: var(--radio); box-shadow: var(--sombra); padding:18px 18px; margin-bottom:16px; border: 1px solid rgba(43,24,16,.04); }
  h2.section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color: var(--rojo); font-weight:800; margin: 22px 2px 10px; }
  h2.section-title:first-child{ margin-top:6px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px 18px; border-radius:16px; border:none; font-family:'Manrope'; font-weight:700; font-size:15.5px; cursor:pointer; transition: transform .12s ease, filter .15s ease; }
  .btn:active{ transform: scale(.97); }
  .btn-primary{ background: var(--rojo); color: var(--blanco); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-gold{ background: var(--dorado); color: var(--tinta); }
  .btn-outline{ background:transparent; border:2px solid var(--rojo); color:var(--rojo); }
  .btn-sm{ width:auto; padding:9px 14px; font-size:13.5px; border-radius:12px; }
  input, select{ width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid #E7DCC3; background: var(--blanco); font-family:'Manrope'; font-size:15px; color:var(--tinta); margin-bottom:12px; outline:none; }
  input:focus, select:focus{ border-color: var(--dorado); }
  label{ font-size:12.5px; font-weight:700; color:var(--tinta); opacity:.7; margin-bottom:6px; display:block; text-transform:uppercase; letter-spacing:.03em; }
  .toggle-row{ display:flex; gap:8px; margin-bottom:12px; }
  .toggle-opt{ flex:1; text-align:center; padding:12px 8px; border-radius:14px; border:1.5px solid #E7DCC3; font-weight:700; font-size:14px; cursor:pointer; background: var(--blanco); color: var(--tinta); opacity:.6; }
  .toggle-opt.active{ opacity:1; border-color: var(--rojo); background: #FCEFEA; color: var(--rojo); }
  .stat-grid{ display:flex; gap:12px; }
  .stat-box{ flex:1; background: linear-gradient(135deg, var(--rojo), var(--rojo-osc)); color:var(--blanco); border-radius:18px; padding:18px 14px; text-align:center; }
  .stat-box.gold{ background: linear-gradient(135deg, var(--dorado), #d99b12); color:var(--tinta); }
  .stat-num{ font-family:'Caveat'; font-size:38px; font-weight:700; line-height:1; }
  .stat-label{ font-size:11.5px; font-weight:700; opacity:.85; text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}
  .list-item{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid #F0E4C8; }
  .list-item:last-child{ border-bottom:none; }
  .li-name{ font-weight:700; font-size:15px; }
  .li-sub{ font-size:12.5px; opacity:.6; margin-top:2px; }
  .badge{ font-size:11px; font-weight:800; padding:5px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.02em; }
  .badge-pend{ background:#FBE7DA; color:#B4551D; }
  .badge-ok{ background:#E4EDD6; color:var(--oliva); }
  .badge-neutral{ background:var(--crema-2); color:var(--tinta); opacity:.75;}
  .empty{ text-align:center; padding:26px 10px; opacity:.55; font-size:14px; }
  .bottomnav{ position:absolute; left:0; right:0; bottom:0; z-index:5; background: var(--blanco); border-top:1px solid #EEE1C4; display:flex; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 20px rgba(43,24,16,.06); }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 2px; border-radius:14px; cursor:pointer; color:var(--tinta); opacity:.45; background:none; border:none; font-family:'Manrope'; font-weight:700; font-size:10px; }
  .nav-btn.active{ opacity:1; color:var(--rojo); background:#FCEFEA; }
  .nav-btn svg{ width:22px; height:22px; }
  .overlay{ position:absolute; inset:0; background:rgba(43,24,16,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ width:100%; max-width:480px; background:var(--crema); border-radius:26px 26px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation: slideup .25s ease; }
  @keyframes slideup{ from{ transform: translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet h3{ margin:0 0 16px; font-size:19px; color:var(--rojo); }
  .close-x{ float:right; cursor:pointer; opacity:.5; font-size:20px; }
  .selector-wrap{ padding: 10px 22px 40px; text-align:center; }
  .logo-inicio { width:160px; height:160px; border-radius:50%; object-fit:cover; border:6px solid var(--blanco); box-shadow: var(--sombra); margin: 0 auto 20px; display:block; }
  .selector-wrap h1{ font-family:'Caveat'; font-size:44px; color:var(--rojo); margin:6px 0 0; }
  .selector-wrap p.tag{ font-size:14px; opacity:.65; margin:0 0 26px; font-weight:600;}
  .quantity-stepper{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .qty-btn{ width:40px; height:40px; border-radius:12px; border:1.5px solid #E7DCC3; background:var(--blanco); font-size:20px; font-weight:800; color:var(--rojo); cursor:pointer; }
  .qty-val{ flex:1; text-align:center; font-weight:800; font-size:18px; }
  table.mini{ width:100%; border-collapse:collapse; font-size:13px; }
  table.mini th{ text-align:left; font-size:10.5px; text-transform:uppercase; opacity:.55; padding:6px 4px; border-bottom:2px solid var(--crema-2);}
  table.mini td{ padding:8px 4px; border-bottom:1px solid var(--crema-2); }
  table.mini input{ margin:0; padding:6px 8px; font-size:13px; border-radius:8px; width:100%; }
  .pin-dots{ display:flex; gap:14px; justify-content:center; margin:18px 0 10px; }
  .pin-dot{ width:16px; height:16px; border-radius:50%; border:2px solid var(--rojo); }
  .pin-dot.filled{ background:var(--rojo); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .key{ padding:16px 0; border-radius:14px; background:var(--blanco); border:1.5px solid #E7DCC3; font-size:20px; font-weight:800; cursor:pointer; }
  .key:active{ background:var(--crema-2); }
  .toast{ position:absolute; bottom:96px; left:50%; transform:translateX(-50%); background:var(--tinta); color:var(--blanco); padding:11px 20px; border-radius:30px; font-size:13.5px; font-weight:700; z-index:50; box-shadow:0 8px 20px rgba(0,0,0,.25); opacity:0; transition:opacity .25s ease; pointer-events:none; max-width:88%; text-align:center; }
  .toast.show{ opacity:1; }
  .toast.warn{ background:#B4551D; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; }
  .muted{ opacity:.6; font-size:12.5px; }
  .banner-min{ background: linear-gradient(135deg, var(--dorado-suave), var(--dorado)); border-radius:18px; padding:16px; margin-bottom:12px; text-align:center; }
  @keyframes spin{ to{transform:rotate(360deg);} }

  /* ---- Loader "pincel escribiendo Pinceles" ---- */
  .brush-loader{ position:relative; width:170px; height:52px; margin:0 auto; }
  .brush-text{ position:absolute; left:0; top:0; width:100%; text-align:left; font-family:'Caveat',cursive; font-weight:700; font-size:38px; color:var(--rojo); white-space:nowrap; line-height:1; clip-path: inset(0 100% 0 0); animation: brushReveal 1.6s ease-in-out infinite; }
  @keyframes brushReveal{ 0%{ clip-path: inset(0 100% 0 0); } 55%{ clip-path: inset(0 0% 0 0); } 100%{ clip-path: inset(0 0% 0 0); } }
  .brush-icon{ position:absolute; top:-4px; left:-8px; width:26px; height:26px; animation: brushMove 1.6s ease-in-out infinite; transform-origin: bottom left; }
  @keyframes brushMove{
    0%   { left:-8px;  transform: rotate(-25deg); opacity:1; }
    55%  { left:148px; transform: rotate(12deg);  opacity:1; }
    58%  { left:148px; transform: rotate(12deg);  opacity:0; }
    60%  { left:-8px;  transform: rotate(-25deg); opacity:0; }
    100% { left:-8px;  transform: rotate(-25deg); opacity:1; }
  }
  .loader-label{ font-weight:800; color:var(--tinta); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; opacity:.55; margin-top:4px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div><div class="brand-title" id="topTitle">Pinceles</div><div class="brand-sub" id="topSub">La app ignaciana</div></div>
    </div>
    <div id="headerActions" style="display:flex; gap:10px; align-items:center;"></div>
  </div>
  <svg class="stroke-divider" viewBox="0 0 400 26" preserveAspectRatio="none"><path class="stroke-path" d="M2 18 C60 4, 120 26, 200 12 S 340 2, 398 16" stroke="var(--rojo)" stroke-width="5" fill="none" stroke-linecap="round"/><path class="stroke-path" d="M2 18 C60 4, 120 26, 200 12 S 340 2, 398 16" stroke="var(--dorado)" stroke-width="2" fill="none" stroke-linecap="round" style="animation-delay:.3s"/></svg>
  <main id="main"></main>
  <div class="bottomnav" id="bottomNav"></div>
  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>

  <div id="loader" style="position:fixed; inset:0; z-index:9999; background:rgba(43,24,16,.3); display:none; align-items:center; justify-content:center;">
    <div style="background:var(--blanco); padding:26px 30px; border-radius:24px; box-shadow:var(--sombra); display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div class="brush-loader">
        <span class="brush-text">Pinceles</span>
        <svg class="brush-icon" viewBox="0 0 24 24" fill="none" stroke="var(--rojo)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          <path d="M5.5 15.5L2 22l6.5-3.5"></path>
        </svg>
      </div>
      <span class="loader-label">Cargando</span>
    </div>
  </div>

</div>

<script>
/* ============================= CONFIGURACIÓN API ============================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwabap5JvbZX2qUOblT_qob_brz8l7BQO-RzWZLqJRF5BCHm3UK55W5igRcG-xF46OS/exec"; 
/* ============================================================================== */

/* Integrantes de EconomyTeam que pueden recibir plata en efectivo */
const RECEPTORES = ["Luli Echenique","Mati Comello","Mili Masloski","Pauli García"];

const DEFAULT_CONFIG = { costoTotal: 120000, pagoMinimo: 18000, horasObjetivo: 17, porcentajeSolidario: 40, valorHora: 7000, valorDocena: 7000, valorMediaDocena: 3500, alias: "gmpinceles2026", pin: "2026" };
const DEFAULT_RECETA = [ {ing:"Carne - kg", c50:15.3}, {ing:"Cebolla - kg", c50:15.3}, {ing:"Papa - kg", c50:4.5}, {ing:"Verdeo - kg", c50:1.1}, {ing:"Huevo - maple", c50:2.25}, {ing:"Aceituna - kg", c50:2.75}, {ing:"Tapa empanadas - cajas", c50:50}, {ing:"Pimentón - g", c50:250}, {ing:"Comino - g", c50:80}, {ing:"Pimienta - g", c50:80}, {ing:"Sal - g", c50:450}, {ing:"Cajas docena - u", c50:50}, {ing:"Cajas media - u", c50:25}, {ing:"Films - u", c50:50}, {ing:"Otros gastos / Extras", c50:null} ];

let STATE = { miNombre: null, pinceles: [], config: {...DEFAULT_CONFIG}, ventas: [], asistencia: [], historial: [], sesiones: {}, minimoPagos: {}, postFeriaPagos: {}, deudaAsignada: {}, ventasMisas: {docenas: 0, medias: 0, donaciones: 0}, receta: JSON.parse(JSON.stringify(DEFAULT_RECETA)), docenasCocinar: 192, tab: "estado", economiaOn: false, ecoTab: "ventas" };

function showLoading(show) { const loader = document.getElementById('loader'); if(loader) loader.style.display = show ? 'flex' : 'none'; }

// Copia profunda simple, usada para poder "revertir" un cambio optimista si el guardado falla.
function snapshot(obj){ return JSON.parse(JSON.stringify(obj)); }

/* -----------------------------------------------------------------------------
   api(): llamada BLOQUEANTE con loader de pantalla completa.
   Se usa solo para las dos cosas que de verdad necesitan esperar la respuesta
   real del servidor: la carga inicial (SYNC) y el reinicio de misión
   (RESET_MISSION), porque ahí sí queremos estar seguros de que Google terminó
   antes de seguir.
----------------------------------------------------------------------------- */
async function api(action, payload = {}) {
  showLoading(true);
  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, payload }) });
    const db = await res.json();
    if(db.error) throw new Error(db.error);
    aplicarDB(db);
    return db;
  } catch(e) { if (action !== 'SYNC') toast("Error de conexión. Intentá de nuevo.", true); throw e; }
  finally { showLoading(false); }
}

/* -----------------------------------------------------------------------------
   apiBackground(): dispara el guardado en Google Sheets SIN bloquear la
   pantalla ni esperar su respuesta para reflejar el cambio (Actualización
   Optimista). El llamador ya modificó STATE y ya llamó a render() antes de
   invocar esta función. Si el guardado falla, se ejecuta onError (que debería
   restaurar el STATE anterior) y se avisa al usuario.
----------------------------------------------------------------------------- */
async function apiBackground(action, payload = {}, onError = null) {
  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, payload }) });
    const db = await res.json();
    if(db.error) throw new Error(db.error);
    if(db && typeof db === 'object' && (db.pinceles || db.ventas || db.asistencia)) {
      aplicarDB(db, {silencioso:true});
    }
  } catch(e) {
    toast("⚠️ No se pudo guardar en Google. Se revirtió el cambio.", true);
    if(onError) onError();
    render();
  }
}

function aplicarDB(db){
  STATE.pinceles = db.pinceles || STATE.pinceles || [];
  STATE.ventas = db.ventas || STATE.ventas || []; STATE.asistencia = db.asistencia || STATE.asistencia || []; STATE.historial = db.historial || STATE.historial || [];
  if(db.config) STATE.config = db.config;
  STATE.sesiones = db.sesiones || STATE.sesiones || {}; STATE.minimoPagos = db.minimoPagos || STATE.minimoPagos || {};
  STATE.postFeriaPagos = db.postFeriaPagos || STATE.postFeriaPagos || {}; STATE.deudaAsignada = db.deudaAsignada || STATE.deudaAsignada || {};
  if(db.ventasMisas) STATE.ventasMisas = db.ventasMisas;
  if(db.receta && db.receta.length > 0) STATE.receta = db.receta;
  if(db.docenasCocinar !== undefined) STATE.docenasCocinar = db.docenasCocinar;
}

const fmt$ = n => "$" + Math.round(n).toLocaleString('es-AR');
function toast(msg, warn){ const t = document.getElementById('toast'); if(!t) return; t.textContent = msg; t.classList.toggle('warn', !!warn); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), warn ? 3200 : 2000); }
function misVentas(nombre){ return STATE.ventas.filter(v=>v.pincel===nombre); }
function docenasEquiv(v){ return (Number(v.docenas)||0) + (Number(v.medias)||0)*0.5; }
function totalDocenasDe(nombre){ return misVentas(nombre).reduce((a,v)=>a+docenasEquiv(v),0); }
function totalHorasDe(nombre){ return STATE.asistencia.filter(a=>a.pincel===nombre).reduce((a,r)=>a+(Number(r.horas)||0),0); }
function localISOTime(isoString){ if(!isoString) return ""; const d = new Date(isoString); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); }

window.cerrarSesion = () => { STATE.miNombre = null; STATE.economiaOn = false; STATE.tab = "estado"; try { localStorage.removeItem('mi_nombre'); } catch(e){} render(); };

/* =============================================================================
   BLOQUE REUTILIZABLE: forma de pago (Transferencia / Efectivo + "¿A quién?")
   Se usa en: Registrar venta, Registrar pagos, Mínimo de misión, Deuda post feria.
============================================================================= */
function metodoPagoHTML(idPrefix, metodoInit, quienInit){
  return `
    <div id="${idPrefix}_wrap">
      <label>Forma de pago</label>
      <div class="toggle-row" id="${idPrefix}_metodo">
        <div class="toggle-opt ${metodoInit==='Transferencia'?'active':''}" data-v="Transferencia">Transferencia</div>
        <div class="toggle-opt ${metodoInit==='Efectivo'?'active':''}" data-v="Efectivo">Efectivo</div>
      </div>
      <div id="${idPrefix}_quien_wrap" style="${metodoInit==='Efectivo'?'':'display:none;'}">
        <label>¿A quién?</label>
        <select id="${idPrefix}_quien">
          <option value="" ${!quienInit?'selected':''} disabled>Elegí a quién</option>
          ${RECEPTORES.map(r=>`<option value="${r}" ${quienInit===r?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
    </div>
  `;
}
function wireMetodoPago(idPrefix){
  let metodo = document.querySelector(`#${idPrefix}_metodo .toggle-opt.active`) ? document.querySelector(`#${idPrefix}_metodo .toggle-opt.active`).dataset.v : null;
  document.querySelectorAll(`#${idPrefix}_metodo .toggle-opt`).forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll(`#${idPrefix}_metodo .toggle-opt`).forEach(x=>x.classList.remove('active'));
      el.classList.add('active'); metodo = el.dataset.v;
      const qw = document.getElementById(`${idPrefix}_quien_wrap`);
      if(qw) qw.style.display = metodo==='Efectivo' ? '' : 'none';
    };
  });
  return {
    getMetodo: ()=> metodo,
    getQuien: ()=> { const el = document.getElementById(`${idPrefix}_quien`); return el ? el.value : ""; }
  };
}
// Modal genérico chico, usado para "Mínimo de misión" y "Deuda post feria".
function openModalMetodoPago(titulo, onConfirm){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" id="ov"><div class="sheet"><span class="close-x" id="closeX">✕</span><h3>${titulo}</h3>${metodoPagoHTML('genpago', null, null)}<button class="btn btn-primary" id="btnConfirmPagoMetodo" style="margin-top:6px;">Confirmar</button></div></div>`;
  document.getElementById('closeX').onclick = ()=> root.innerHTML="";
  document.getElementById('ov').onclick = (e)=>{ if(e.target.id==='ov') root.innerHTML=""; };
  const wire = wireMetodoPago('genpago');
  document.getElementById('btnConfirmPagoMetodo').onclick = ()=>{
    const metodo = wire.getMetodo();
    if(!metodo){ toast("Elegí transferencia o efectivo"); return; }
    let quien = null;
    if(metodo==='Efectivo'){ quien = wire.getQuien(); if(!quien){ toast("Elegí a quién se lo diste"); return; } }
    root.innerHTML = "";
    onConfirm(metodo, quien);
  };
}

function render(){
  try {
    const actions = document.getElementById('headerActions');
    if(!STATE.miNombre){ actions.innerHTML = ``; renderSelector(); return; }
    
    actions.innerHTML = `<button class="btn-logout" onclick="cerrarSesion()">Salir</button><div class="icon-btn" id="btnGear" title="Panel EconomyTeam"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--rojo)" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6c.57-.24 1-.77 1-1.51V3a2 2 0 114 0v.09c0 .74.43 1.27 1 1.51.62.26 1.35.14 1.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06c-.47.47-.59 1.2-.33 1.82.24.57.77 1 1.51 1H21a2 2 0 110 4h-.09c-.74 0-1.27.43-1.51 1z"/></svg></div><img src="logo.jpg" alt="Logo" class="logo-header">`;

g></div></div>`).join("")}</div>`;

  document.getElementById('docMinus').onclick=()=>{ doc=Math.max(0,doc-1); document.getElementById('docVal').textContent=doc; }; document.getElementById('docPlus').onclick=()=>{ doc++; document.getElementById('docVal').textContent=doc; }; document.getElementById('medMinus').onclick=()=>{ med=Math.max(0,med-1); document.getElementById('medVal').textContent=med; }; document.getElementById('medPlus').onclick=()=>{ med++; document.getElementById('medVal').textContent=med; };
  document.querySelectorAll('#tipoRow .toggle-opt').forEach(el=>el.onclick=()=>{ document.querySelectorAll('#tipoRow .toggle-opt').forEach(x=>x.classList.remove('active')); el.classList.add('active'); tipo = el.dataset.v; });

  let pagoWire = null;

      if(!metodoFinal){ toast("Elegí si fue por transferencia o efectivo"); return; }
      if(metodoFinal === 'Efectivo'){ quienFinal = pagoWire.getQuien(); if(!quienFinal){ toast("Elegí a quién le diste el efectivo"); return; } }
    }

    if(reg){
      reg.cliente = cliente; reg.docenas = doc; reg.medias = med; reg.tipo = tipo; reg.estado = estado; reg.metodoPago = metodoFinal; reg.recibidoPor = quienFinal;

      apiBackground('ADD_VENTA', nueva, ()=>{ STATE.ventas = prevVentas; });

}

function openModalRegistrarPago(){
  const root = document.getElementById('modalRoot'), pendientes = misVentas(STATE.miNombre).filter(v=>v.estado==="Falta Pagar");
  root.innerHTML = `<div class="overlay" id="ov"><div class="sheet"><span class="close-x" id="closeX">✕</span><h3>Registrar pagos</h3><p class="muted" style="font-size:11px; margin-top:-6px; line-height:1.3;">Tildá únicamente las ventas por las cuales <b>ya le transferiste</b> el dinero a Economía.</p>${pendientes.length===0 ? `<div class="empty">No tenés transferencias pendientes a Economía.</div>` : `${pendientes.map(v=>`<label style="display:flex; align-items:center; gap:10px; text-transform:none; font-weight:600; opacity:1; margin:10px 0;"><input type="checkbox" class="chkPago" data-id="${v.id}" style="width:auto; margin:0;">${v.cliente} — ${v.docenas? v.docenas+' doc ':''}${v.medias? v.medias+' 1/2 doc':''}</label>`).join("")}${metodoPagoHTML('bpago', null, null)}<button class="btn btn-primary" id="btnConfirmarPagos" style="margin-top:10px;">Confirmar pagos</button>`}</div></div>`;

function calcularLiquidacion(nombre){
  const c = STATE.config, horas = totalHorasDe(nombre), docenasVendidas = totalDocenasDe(nombre);
  const baseFaltante = (c.horasObjetivo || 17) - horas - docenasVendidas;
  const deudaMonto = Math.max(0, Math.round(baseFaltante * (c.valorHora || 7000) * ((c.porcentajeSolidario||40)/100)));
  return {horas, docenasVendidas, deudaMonto};
}

function renderEcoLiquidacion(main){
  const todos = [...new Set([...STATE.pinceles, ...STATE.ventas.map(v=>v.pincel), ...STATE.asistencia.map(a=>a.pincel), ...Object.keys(STATE.minimoPagos)])].sort();
  
  const activos = todos.filter(n => {
    const r = calcularLiquidacion(n);
    const pagomin = STATE.minimoPagos[n] && STATE.minimoPagos[n].pagado;
    const pagopost = STATE.postFeriaPagos[n] && STATE.postFeriaPagos[n].pagado;
    const deuda = STATE.deudaAsignada[n] && STATE.deudaAsignada[n] > 0;
    return r.horas > 0 || r.docenasVendidas > 0 || pagomin || pagopost || deuda;
  });

  main.innerHTML = `
    <h2 class="section-title">Liquidación Post Feria</h2><p class="muted" style="margin:0 0 12px; font-size:11.5px;">Cálculo: (Horas misión - hs - docenas) * ${fmt$(STATE.config.valorHora||7000)} * ${STATE.config.porcentajeSolidario||40}%</p>
    <div class="card">
      ${activos.length===0 ? `<div class="empty">Nadie registró horas ni ventas todavía.</div>` : activos.map(n=>{

        return `<div class="list-item" style="flex-direction:column; align-items:flex-start; gap:8px;"><div class="row-between" style="width:100%;"><div><div class="li-name">${n}</div><div class="li-sub">${r.horas.toFixed(1)} hs · ${r.docenasVendidas} doc.</div></div><div style="text-align:right;"><span class="badge ${r.deudaMonto>0?'badge-pend':'badge-ok'}" style="white-space:nowrap; display:block; margin-bottom:4px;">Debe: ${fmt$(r.deudaMonto)}</span>${yaAsignada > 0 ? `<span style="font-size:10px; color:var(--oliva); font-weight:800; display:block; margin-bottom:4px;">Ya asignado: ${fmt$(yaAsignada)}</span>${postFeriaOk ? `<span style="font-size:10px; background:var(--oliva); color:white; padding:2px 6px; border-radius:10px; font-weight:700;">Pagó deuda ✅</span>` : `<span style="font-size:10px; background:#B4551D; color:white; padding:2px 6px; border-radius:10px; font-weight:700;">Aún no pagó</span>`}` : ''}</div></div>${(r.deudaMonto > 0 && !postFeriaOk) ? `<button class="btn btn-outline btn-sm" style="width:100%; padding:6px; font-size:12px;" onclick="asignarDeuda('${n}', ${r.deudaMonto})">${yaAsignada > 0 ? 'Actualizar deuda asignada' : 'Confirmar y asignar deuda a su perfil'}</button>` : ''}</div>`;
      }).join("")}

window.reiniciarMision = async () => {
  const confirm1 = confirm("⚠️ ATENCIÓN: Estás por guardar el historial y borrar TODAS las ventas, horas y gastos para iniciar una nueva feria. ¿Estás seguro?");
  if(!confirm1) return;

  const nombreMision = prompt("Ponele un nombre a esta feria/misión para guardarla en el Historial (ej: 'Feria Julio 2026'):");
  if(!nombreMision || !nombreMision.trim()){ toast("Reinicio cancelado: hace falta un nombre para archivarla."); return; }

  const confirm2 = prompt("Escribí la palabra BORRAR (en mayúsculas) para confirmar:");
  if(confirm2 !== "BORRAR") { toast("Reinicio cancelado."); return; }
  
  const c = STATE.config, egresos = STATE.receta.reduce((a,r) => a + (Number(r.gasto)||0), 0);
  let docPinceles = 0, medPinceles = 0;
  STATE.ventas.forEach(v => { docPinceles += Number(v.docenas)||0; medPinceles += Number(v.medias)||0; });
  const ingresosPinceles = (docPinceles * (c.valorDocena||7000)) + (medPinceles * (c.valorMediaDocena||3500));
  const docMisas = Number(STATE.ventasMisas.docenas)||0, medMisas = Number(STATE.ventasMisas.medias)||0;
  const ingresosMisas = (docMisas * (c.valorDocena||7000)) + (medMisas * (c.valorMediaDocena||3500)), donaciones = Number(STATE.ventasMisas.donaciones)||0;
  const ingresosTotales = ingresosPinceles + ingresosMisas + donaciones, ganancia = ingresosTotales - egresos;
  
  const confStr = `Mínimo: ${fmt$(c.pagoMinimo)} • Hs Misión: ${c.horasObjetivo} hs • Valor 1hr: ${fmt$(c.valorHora)} • Docena: ${fmt$(c.valorDocena)} • 1/2 Doc: ${fmt$(c.valorMediaDocena)} • Solidario: ${c.porcentajeSolidario}%`;

  const summary = {
    nombre: nombreMision.trim(),
    fecha: new Date().toLocaleDateString('es-AR'),
    docPinceles: docPinceles + (medPinceles*0.5), docMisas: docMisas + (medMisas*0.5),
    ingresos: ingresosTotales, egresos: egresos, ganancia: ganancia, config: confStr
  };

  try { await api('RESET_MISSION', summary); toast("Misión archivada y reiniciada 🗂️"); render(); }
  catch(e) { toast("No se pudo reiniciar la misión, intentá de nuevo.", true); }
};

  main.innerHTML = `
    <h2 class="section-title">Resultados de la Feria Actual</h2><div class="banner-min" style="background:${gananciaNeta >= 0 ? 'var(--oliva)' : 'var(--rojo)'}; color:var(--blanco); padding:18px;"><div style="font-size:13px; font-weight:700; text-transform:uppercase; opacity:.9;">Ganancia Neta</div><div class="stat-num" style="font-size:42px; margin:4px 0;">${fmt$(gananciaNeta)}</div><div style="font-size:12px; font-weight:500; opacity:.8;">(Ingresos totales menos Egresos totales)</div></div>
    <div class="card"><div class="row-between" style="margin-bottom:8px;"><span class="muted">Ventas Pinceles</span><strong>${fmt$(ingresosPinceles)}</strong></div><div class="row-between" style="margin-bottom:8px;"><span class="muted">Ventas en Misas</span><strong>${fmt$(ingresosMisas)}</strong></div><div class="row-between" style="margin-bottom:8px;"><span class="muted">Donaciones (Misas)</span><strong>${fmt$(totalDonaciones)}</strong></div><div style="height:1px; background:#EEE1C4; margin:14px 0;"></div><div class="row-between" style="color:var(--oliva);"><strong>Total Ingresos</strong><strong style="font-size:18px;">${fmt$(ingresosTotales)}</strong></div></div>
    <div class="card"><div class="row-between" style="color:var(--rojo);"><strong>Total Gastos (Compras)</strong><strong style="font-size:18px;">${fmt$(egresosTotales)}</strong></div></div>
    
    <div style="margin-top:40px; padding-top:20px; border-top:2px dashed #E7DCC3;">
      <h2 class="section-title" style="color:var(--rojo);">⚠️ Zona de Peligro</h2>
      <p class="muted" style="font-size:11.5px; margin-bottom:10px;">Esto guardará un resumen en el Historial (con el nombre que le pongas) y borrará las ventas y horas de la feria actual.</p>
      <button class="btn btn-outline" style="border-color:var(--rojo); color:var(--rojo);" onclick="reiniciarMision()">Archivar y Reiniciar Misión</button>
    </div>

    <h2 class="section-title" style="margin-top:30px;">Historial de Misiones</h2>
    <div class="card">
      ${historial.length===0 ? `<div class="empty">Todavía no hay misiones archivadas.</div>` : historial.slice().reverse().map(h=>`
        <div style="border-bottom:1px solid #F0E4C8; padding-bottom:12px; margin-bottom:12px;">
          <div class="row-between" style="margin-bottom:2px;"><strong style="color:var(--rojo); font-size:15.5px;">${h.nombre ? h.nombre : ('Feria del '+h.fecha)}</strong><span class="badge ${h.ganancia >= 0 ? 'badge-ok' : 'badge-pend'}" style="font-size:11px;">Neta: ${fmt$(Number(h.ganancia))}</span></div>
          <div class="muted" style="margin-bottom:8px;">${h.nombre ? h.fecha : ''}</div>
          <div class="row-between" style="font-size:12px; margin-bottom:4px;"><span class="muted">Ingresos Totales:</span><strong>${fmt$(Number(h.ingresos))}</strong></div>
          <div class="row-between" style="font-size:12px; margin-bottom:4px;"><span class="muted">Egresos Totales:</span><strong>${fmt$(Number(h.egresos))}</strong></div>
          <div class="row-between" style="font-size:12px; margin-bottom:4px;"><span class="muted">Ventas Pinceles:</span><strong>${h.docPinceles} doc.</strong></div>
          <div class="row-between" style="font-size:12px; margin-bottom:8px;"><span class="muted">Ventas Misas:</span><strong>${h.docMisas} doc.</strong></div>
          <div style="font-size:11px; background:var(--crema-2); padding:8px; border-radius:8px; color:var(--tinta); opacity:0.9; line-height:1.4;"><strong>Parámetros usados:</strong><br>${h.config}</div>
        </div>
      `).join("")}
    </div>
  `;
}

/* ============================= INIT ============================= */
(async function init(){
  try { STATE.miNombre = localStorage.getItem('mi_nombre'); } catch(e){}
  try { render(); } catch(e) {}
  try { await api('SYNC'); } catch(e) {}
  try { render(); } catch(e) {}
})();
</script>
</body>
</html>
